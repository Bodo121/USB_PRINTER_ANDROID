name: Flutter Material 3 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform project
        run: flutter create . --project-name digitus_print --platforms android
      - name: Install native Canon IVEC encoder and Flutter bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('native/src/main')
          target=Path('android/app/src/main')
          for src in (root/'kotlin').rglob('*.kt'):
              dst=target/'kotlin'/src.relative_to(root/'kotlin')
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
          dst=target/'assets'
          dst.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(root/'assets'/'ivec_models.json',dst/'ivec_models.json')
          PY
      - name: Enable Android built-in Kotlin
        run: echo 'android.builtInKotlin=true' >> android/gradle.properties
      - name: Enable Android network discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application',1)
          p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub upgrade --major-versions
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos lib
      - name: Run discovery unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DigitusPrint-Flutter-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
