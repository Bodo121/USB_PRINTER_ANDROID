name: Flutter Material 3 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform project
        run: flutter create . --project-name digitus_print --platforms android
      - name: Install native Canon IVEC encoder and Flutter bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('native/src/main')
          target=Path('android/app/src/main')
          for src in (root/'kotlin').rglob('*.kt'):
              dst=target/'kotlin'/src.relative_to(root/'kotlin')
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
          dst=target/'assets'
          dst.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(root/'assets'/'ivec_models.json',dst/'ivec_models.json')
          import os
          for src in (root/'res').rglob('*'):
              if src.is_file():
                  targetfile=target/'res'/src.relative_to(root/'res')
                  targetfile.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(src,targetfile)
          PY
      - name: Enable Android built-in Kotlin
        run: echo 'android.builtInKotlin=true' >> android/gradle.properties
      - name: Enable Android network discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application',1)
          s=s.replace('<application', '<application android:usesCleartextTraffic="true"',1)
          s=s.replace('<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>',1)
          provider='''<provider android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.updates"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data android:name="android.support.FILE_PROVIDER_PATHS"
                     android:resource="@xml/update_paths"/>
              </provider>'''
          s=s.replace('</application>',provider+'\n    </application>',1)
          p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub upgrade --major-versions
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos lib
      - name: Run discovery unit tests
        run: flutter test test/hub_probe_test.dart test/usbip_discovery_test.dart test/usb_port_diagnostics_test.dart test/vendor_usb_discovery_test.dart test/dcp_discovery_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DigitusPrint-Flutter-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Check if stable Android signing secrets are configured
        id: release-signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYPASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$PASSWORD" && -n "$ALIAS" && -n "$KEYPASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release-signing secrets configured; skipping GitHub Release."
          fi
      - name: Prepare release signing (stable secret key, never stored in repository)
        if: steps.release-signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > android/app/updates-signing.jks
          chmod 600 android/app/updates-signing.jks
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          target='signingConfig = signingConfigs.getByName("debug")'
          assert target in s, "Flutter generated Gradle template changed"
          s=s.replace(target,'signingConfig = signingConfigs.getByName("publication")',1)
          assert 'android {' in s
          s=s.replace('android {','''android {
              signingConfigs {
                  create("publication") {
                      keyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
                      storeFile = file("updates-signing.jks")
                      storePassword = System.getenv("ANDROID_RELEASE_KEYSTORE_PASSWORD")
                  }
              }
          ''',1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        if: steps.release-signing.outputs.enabled == 'true'
        env:
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: flutter build apk --release
      - name: Publish signed APK to GitHub Releases
        if: steps.release-signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; never overwrite signed published APKs."
            exit 0
          fi
          gh release create "$TAG" "build/app/outputs/flutter-apk/app-release.apk#DigitusPrint.apk" \
            --target "$GITHUB_SHA" \
            --title "DigitusPrint $TAG" \
            --notes "DigitusPrint Android update. Experimental Canon G2420 printer compatibility remains unverified."
